<div class="release-history-container">
  <h2>Historique des releases</h2>
  <div *ngIf="loading()" class="loading">Chargement…</div>
  <div *ngIf="error()" class="error">{{ error() }}</div>
  <div *ngIf="!loading() && !error()">
    <ul class="release-list">
      <li *ngFor="let release of releases()" class="release-item">
        <a class="release-title" [routerLink]="['/release-details', release.id]">{{ release.name }}</a>
        <div class="release-author">Auteur : {{ release.author || '—' }}</div>
        <div class="release-date">Date : {{ (release.createdAt || release.date) | date:'dd/MM/yyyy HH:mm' }}</div>
      </li>
    </ul>
    <div *ngIf="releases().length === 0" class="empty">Aucun release trouvé.</div>
  </div>
</div>
